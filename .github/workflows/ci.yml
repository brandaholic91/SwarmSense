name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  workflow_sanity:
    name: Workflow and compose sanity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (for actionlint)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Validate GitHub workflows with actionlint
        run: ~/go/bin/actionlint

      - name: Validate production compose syntax
        run: docker compose -f docker-compose.swarmsense-backend.yml config

  frontend:
    name: Frontend lint/test/build
    runs-on: ubuntu-latest
    needs: workflow_sanity
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: workflow_sanity
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        run: pytest tests -q
