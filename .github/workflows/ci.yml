name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  workflow_sanity:
    name: Workflow and compose sanity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (for actionlint)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Validate GitHub workflows with actionlint
        run: ~/go/bin/actionlint

      - name: Validate dev compose syntax
        run: docker compose -f docker-compose.dev.yml config

  frontend:
    name: Frontend lint/test/build
    runs-on: ubuntu-latest
    needs: workflow_sanity
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: workflow_sanity
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: swarmsense
          POSTGRES_PASSWORD: swarmsense
          POSTGRES_DB: swarmsense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarmsense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        env:
          SWARMSENSE_TEST_DATABASE_URL: postgresql://swarmsense:swarmsense@localhost:5432/swarmsense_test
        run: pytest tests -q
