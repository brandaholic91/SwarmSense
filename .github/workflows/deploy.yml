name: Deploy Backend

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, push, and deploy backend
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.head_branch == 'master' ||
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/swarmsense-backend
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Normalize image name
        id: image
        run: |
          image_name=$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:${{ env.IMAGE_TAG }}
            ${{ steps.image.outputs.image_name }}:latest

      - name: Deploy on Hetzner via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.HETZNER_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || '22' }}
          envs: DEPLOY_PATH,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            if [ -f "docker-compose.yml" ]; then
              docker compose pull
              docker compose up -d
            elif [ -f "docker-compose.swarmsense-backend.yml" ]; then
              docker compose -f docker-compose.swarmsense-backend.yml pull
              docker compose -f docker-compose.swarmsense-backend.yml up -d
            else
              echo "No docker compose file found in $DEPLOY_PATH" >&2
              exit 1
            fi

      - name: Post-deploy HTTPS health check
        run: |
          set -euo pipefail
          health_url="${{ secrets.BACKEND_HEALTHCHECK_URL }}"
          max_attempts=6
          sleep_seconds=10

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Health check attempt ${attempt}/${max_attempts}: ${health_url}"
            if curl --fail --silent --show-error --max-time 15 "$health_url"; then
              echo "Health check passed."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Health check failed, retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
          done

          echo "Health check failed after ${max_attempts} attempts." >&2
          exit 1
