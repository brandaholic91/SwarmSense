name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, push, and deploy backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/swarmsense-backend
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          image_name=$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:${{ env.IMAGE_TAG }}
            ${{ steps.image.outputs.image_name }}:latest

      - name: Deploy on Hetzner via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.HETZNER_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || '22' }}
          envs: DEPLOY_PATH,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            if [ -f "docker-compose.yml" ]; then
              docker compose pull
              docker compose up -d
            elif [ -f "docker-compose.swarmsense-backend.yml" ]; then
              docker compose -f docker-compose.swarmsense-backend.yml pull
              docker compose -f docker-compose.swarmsense-backend.yml up -d
            else
              echo "No docker compose file found in $DEPLOY_PATH" >&2
              exit 1
            fi

      - name: Post-deploy HTTPS health check
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "${{ secrets.BACKEND_HEALTHCHECK_URL }}"
