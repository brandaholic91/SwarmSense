name: Supabase Migrations Draft

on:
  pull_request:
    paths:
      - supabase/migrations/**
      - supabase/config.toml
      - .github/workflows/supabase-migrations-draft.yml
  workflow_dispatch:

jobs:
  migration-file-sanity:
    name: Migration file sanity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration filenames and version uniqueness
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          migration_dir = Path("supabase/migrations")
          files = sorted(migration_dir.glob("*.sql"))
          if not files:
              raise SystemExit("No migration files found in supabase/migrations")

          pattern = re.compile(r"^(\d{11,})_[a-z0-9_]+\.sql$")
          seen = set()
          for file in files:
              name = file.name
              match = pattern.match(name)
              if not match:
                  raise SystemExit(
                      f"Invalid migration filename: {name}. "
                      "Expected <timestamp>_<snake_case>.sql"
                  )
              version = match.group(1)
              if version in seen:
                  raise SystemExit(f"Duplicate migration version detected: {version}")
              seen.add(version)

          print(f"Validated {len(files)} migration files")
          PY

  # Draft only: keep this job disabled until CI can access Supabase project secrets.
  # Recommended next step:
  # - add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD secrets
  # - link project with SUPABASE_PROJECT_REF
  # - then enable a dry-run `supabase db push` job here
