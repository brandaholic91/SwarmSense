# Csak helyi fejlesztésre: a jelszó nem titok, ne használd máshol.
name: swarmsense-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: swarmsense
      POSTGRES_PASSWORD: swarmsense
      POSTGRES_DB: swarmsense
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - swarmsense-dev-pg:/var/lib/postgresql/data
      - ./backend/dev/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  swarmsense-dev-pg:
