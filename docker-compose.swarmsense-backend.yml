services:
  swarmsense-backend:
    image: ${BACKEND_IMAGE_REPO:-ghcr.io/brandaholic91/swarmsense-backend}:${BACKEND_IMAGE_TAG:-latest}
    container_name: swarmsense-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    networks:
      - shared_internal
      - public_egress
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/status', timeout=3)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  shared_internal:
    name: shared_internal
    external: true
  public_egress:
    driver: bridge
